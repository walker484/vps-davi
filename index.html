<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Walker Builder</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Walker Builder</h1>
    <p>Construa seu site</p>
  </header>

  <main>

    <!-- ÁREA DO EDITOR -->
    <section id="editor">

      <h2>Editor</h2>

      <button>Adicionar texto</button>

      <button>Adicionar imagem</button>

      <button>Mudar fundo</button>

    </section>


    <!-- PRÉ-VISUALIZAÇÃO -->
    <section id="preview">

      <h2>Pré-visualização</h2>

      <div id="sitePreview">

        <h1>Meu Site</h1>

        <p>Meu primeiro site criado no Walker Builder.</p>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>

</html>
